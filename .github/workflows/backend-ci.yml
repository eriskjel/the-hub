name: backend-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect backend changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
      - id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        with:
          files: |
            services/spring/**
            .github/workflows/backend-ci.yml
            .github/scripts/backend-*

  # Preserve the existing required "lint" check while running the full verification.
  lint:
    needs: detect
    if: needs.detect.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hub_test
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub_test -d hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check build gate behavior
        run: node --test .github/scripts/backend-gate.test.mjs
      - name: Verify formatting, style and tests
        working-directory: services/spring
        env:
          HUB_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/hub_test
          HUB_TEST_DATABASE_USER: hub_test
          HUB_TEST_DATABASE_PASSWORD: test-only-password
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  docker:
    name: Build (PR) / Build & Push (main)
    runs-on: ubuntu-latest
    needs: [detect, lint]
    # Run even when prerequisites fail or skip so the required check is always reported;
    # the gate step rejects failed prerequisites. Superseded (cancelled) runs stay cancelled.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate verification results
        id: gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          CHANGED: ${{ needs.detect.outputs.changed }}
          VERIFY_RESULT: ${{ needs.lint.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/backend-gate.sh >> "$GITHUB_OUTPUT"
      - name: No backend changes
        if: steps.gate.outputs.build == 'false'
        run: echo "No backend changes; verification and build are not required."
      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'
      - name: Generate CalVer tag
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: calver
        run: echo "tag=$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (no push)
        if: steps.gate.outputs.build == 'true' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: services/spring
          file: services/spring/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            APP_VERSION=dev
      - name: Build & Push (GHCR)
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: services/spring
          file: services/spring/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.calver.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/the-hub-api:latest
            ghcr.io/${{ github.repository_owner }}/the-hub-api:${{ steps.calver.outputs.tag }}
