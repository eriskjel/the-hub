management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript

app.cors.allowed-origins=https://skjellevik.online,https://www.skjellevik.online

logging.level.root=INFO
logging.level.dev.thehub.backend=INFO

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false